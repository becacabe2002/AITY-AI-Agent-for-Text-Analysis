# Alembic configuration for the aity_web database (ADR-004).
# Run from the repo root; the URL comes from AITY_DATABASE_URL (never put it here).
# Dev database: docker compose -f compose.dev.yml up -d
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "add user_api_keys" --rev-id 0002
#   alembic downgrade -1   |   alembic downgrade base
#   alembic history
#
# Workflow: edit src/aity_web/db/tables.py -> upgrade the dev DB to head ->
# autogenerate -> review the draft (checklist in its docstring) -> upgrade ->
# AITY_DB_TESTS=1 python -m pytest tests/db (fails if migrations and tables.py differ).

[alembic]
script_location = aity_web.db:migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
